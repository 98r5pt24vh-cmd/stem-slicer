name: Build Slicer Electron Windows Cloud alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "electron-windows-alpha-*"

permissions:
  contents: read

jobs:
  build-electron-windows-alpha:
    runs-on: windows-2025
    timeout-minutes: 240

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TOKENIZERS_PARALLELISM: "false"
      SLICER_PACKAGE_RUNTIME: "1"
      SLICER_CLOUD_PROJECT_URL: ${{ vars.SLICER_CLOUD_PROJECT_URL }}
      SLICER_CLOUD_PUBLISHABLE_KEY: ${{ secrets.SLICER_CLOUD_PUBLISHABLE_KEY }}

    steps:
      - name: Check out the recorded revision
        uses: actions/checkout@v7

      - name: Record and verify the clean revision
        shell: pwsh
        run: |
          git status --short
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw "The checkout is not clean." }
          git rev-parse HEAD | Set-Content electron-app/build-revision.txt

      - name: Set up Node.js 24 and pnpm 11.19.0
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"

      - name: Set up official CPython 3.12.10 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: "x64"
          check-latest: false

      - name: Verify the Windows runtime
        run: >-
          python -c "import platform, sys;
          assert sys.version_info[:3] == (3, 12, 10), sys.version;
          assert platform.architecture()[0] == '64bit', platform.architecture()"

      - name: Install Electron and test dependencies
        working-directory: electron-app
        run: pnpm install --frozen-lockfile

      - name: Create the exact Slicer Python runtime
        working-directory: electron-app
        env:
          SLICER_BOOTSTRAP_PYTHON: python
        run: pnpm run runtime:setup

      - name: Verify the self-contained Windows runtime
        working-directory: electron-app
        shell: pwsh
        run: |
          $runtime = (Resolve-Path ".runtime/python").Path
          if (Test-Path ".runtime/python/pyvenv.cfg") { throw "The packaged runtime must not be a Windows venv." }
          if (Get-ChildItem ".runtime/python" -Filter "python-*-amd64.exe") { throw "The CPython bootstrap installer must not be packaged." }
          & ".runtime/python/python.exe" -c "import json, pathlib, sys; expected = pathlib.Path(sys.argv[1]).resolve(); prefix = pathlib.Path(sys.prefix).resolve(); base = pathlib.Path(sys.base_prefix).resolve(); assert prefix == expected, (prefix, expected); assert base == expected, (base, expected); assert 'hostedtoolcache' not in str(base).casefold(), base; print(json.dumps({'executable': sys.executable, 'prefix': str(prefix), 'basePrefix': str(base)}))" $runtime
          if ($LASTEXITCODE -ne 0) { throw "The Windows runtime is not self-contained." }

      - name: Fetch and verify the pinned offline MERT payload
        run: python scripts/fetch_mert_payload.py

      - name: Run the complete Electron and Python source roster
        working-directory: electron-app
        run: pnpm run validate:source

      - name: Validate the strict Electron MIDI lifecycle
        shell: pwsh
        run: |
          & "electron-app/.runtime/python/python.exe" `
            electron-app/scripts/smoke-electron-midi.py `
            --source-root . `
            --bridge-root electron-app/python `
            --timeout 30

      - name: Set up MinGW and build pinned Bungee
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Fetch the pinned Bungee source
        shell: pwsh
        run: |
          git init bungee-source
          Push-Location bungee-source
          git remote add origin https://github.com/bungee-audio-stretch/bungee.git
          git fetch --depth 1 origin 746833f68a574d997ec50443e7cfd2d37b026302
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive
          git apply ../patches/bungee-waveformatextensible.patch
          if ((git rev-parse HEAD).Trim() -ne "746833f68a574d997ec50443e7cfd2d37b026302") { throw "Unexpected Bungee revision." }
          Pop-Location

      - name: Build static Bungee
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd bungee-source
          cmake --preset windows-x86_64 -B ../bungee-build -DBUNGEE_BUILD_SHARED_LIBRARY=OFF -DBUNGEE_VERSION=2.4.24
          cmake --build ../bungee-build --target bungee_executable --parallel 2
          cd ..
          mkdir -p bin
          cp bungee-build/bungee.exe bin/bungee.exe
          ./bin/bungee.exe --help

      - name: Download and verify pinned FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor-windows/ffmpeg-bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1/ffmpeg-win32-x64" -OutFile "vendor-windows/ffmpeg-bin/ffmpeg.exe"
          $expected = "4b3a7a7c41a4064a8738536da6a304371c1fdc567c599ccb768bebd49ccdb9fb"
          $actual = (Get-FileHash "vendor-windows/ffmpeg-bin/ffmpeg.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected FFmpeg SHA-256: $actual" }

      - name: Verify the complete Windows engine inventory
        working-directory: electron-app
        run: pnpm run engine:check

      - name: Assemble Electron sidecar resources
        shell: pwsh
        run: |
          $packaging = "electron-app/.packaging"
          $engine = "$packaging/engine"
          $runtime = "$packaging/.runtime/python"
          $bridge = "$packaging/python"
          $cloud = "$packaging/cloud"
          New-Item -ItemType Directory -Force $runtime, $bridge, $cloud | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:SLICER_CLOUD_PROJECT_URL)) { throw "SLICER_CLOUD_PROJECT_URL is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:SLICER_CLOUD_PUBLISHABLE_KEY)) { throw "SLICER_CLOUD_PUBLISHABLE_KEY is not configured." }
          @{
            projectUrl = $env:SLICER_CLOUD_PROJECT_URL
            publishableKey = $env:SLICER_CLOUD_PUBLISHABLE_KEY
          } | ConvertTo-Json | Set-Content "$cloud/project.json" -Encoding utf8NoBOM
          node electron-app/scripts/stage-engine-resources.mjs $engine win32
          Copy-Item electron-app/python/engine_bridge.py $bridge
          Copy-Item -Recurse -Force "electron-app/.runtime/python/*" $runtime

      - name: Report packaged payload sizes
        shell: pwsh
        run: |
          $root = "electron-app/.packaging"
          foreach ($relative in @("engine/models", "engine/analyzer/checkpoints", "engine/bin", ".runtime/python")) {
            $bytes = (Get-ChildItem "$root/$relative" -Recurse -File | Measure-Object Length -Sum).Sum
            "{0}: {1:N0} bytes" -f $relative, $bytes
          }

      - name: Smoke-test the staged persistent bridge
        shell: pwsh
        env:
          STEM_SLICER_SOURCE_ROOT: ${{ github.workspace }}\electron-app\.packaging\engine
        run: |
          '{"type":"shutdown"}' | & "electron-app/.packaging/.runtime/python/python.exe" -u "electron-app/.packaging/python/engine_bridge.py" | Tee-Object -FilePath bridge-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "The staged Electron engine bridge failed." }
          $readyLine = Get-Content bridge-smoke.log | Where-Object { $_ -match '"type":\s*"ready"' } | Select-Object -Last 1
          if (-not $readyLine) { throw "The bridge never became ready." }
          $ready = $readyLine | ConvertFrom-Json
          $expectedRuntime = (Resolve-Path "electron-app/.packaging/.runtime/python").Path
          if ([IO.Path]::GetFullPath($ready.basePrefix) -ne [IO.Path]::GetFullPath($expectedRuntime)) {
            throw "The staged bridge escaped its packaged Python runtime: $($ready.basePrefix)"
          }
          if ($ready.python -match 'hostedtoolcache' -or $ready.basePrefix -match 'hostedtoolcache') {
            throw "The staged bridge still references the GitHub runner Python."
          }

      - name: Make the unsigned Windows alpha ZIP
        working-directory: electron-app
        run: pnpm run make -- --platform=win32 --arch=x64

      - name: Audit, extract and launch the exact ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem electron-app/out/make -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Electron Forge did not create a Windows ZIP." }
          New-Item -ItemType Directory -Force validation-output | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath validation-output
          $exe = Get-ChildItem validation-output -Recurse -Filter Slicer.exe | Select-Object -First 1
          if (-not $exe) { throw "The extracted ZIP has no Slicer.exe." }
          node electron-app/scripts/audit-electron-windows-bundle.mjs $exe.Directory.FullName
          $engineSmoke = Join-Path (Resolve-Path validation-output) "packaged-engine-status.json"
          $env:SLICER_ENGINE_SMOKE_FILE = $engineSmoke
          $process = Start-Process -FilePath $exe.FullName -PassThru
          $deadline = (Get-Date).AddMinutes(5)
          while (-not (Test-Path $engineSmoke) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if ($process.HasExited) { throw "The extracted Slicer.exe exited during engine startup with code $($process.ExitCode)." }
          }
          if (-not (Test-Path $engineSmoke)) { throw "The exact extracted Slicer.exe did not report an engine state within five minutes." }
          $engineState = Get-Content $engineSmoke -Raw | ConvertFrom-Json
          if ($engineState.state -ne "ready") { throw "The exact extracted Slicer.exe engine failed: $($engineState.message)" }
          Stop-Process -Id $process.Id
          Get-Content $engineSmoke
          Get-FileHash $zip.FullName -Algorithm SHA256 | Format-List
          Copy-Item $zip.FullName "Slicer-Electron-Windows-Cloud-Alpha.zip"

      - name: Upload the validated private alpha
        uses: actions/upload-artifact@v7
        with:
          name: Slicer-Electron-Windows-Cloud-Alpha
          path: |
            Slicer-Electron-Windows-Cloud-Alpha.zip
            electron-app/build-revision.txt
            bridge-smoke.log
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
